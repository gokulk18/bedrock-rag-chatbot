name: "Deploy Frontend"
description: "Injects the API endpoint config, syncs the frontend to S3, and invalidates CloudFront."

inputs:
  aws-role-arn:
    description: "IAM role ARN to assume for frontend deployments."
    required: true
  aws-region:
    description: "AWS region."
    required: true
  frontend-bucket:
    description: "S3 bucket name for the frontend."
    required: true
  cloudfront-id:
    description: "CloudFront distribution ID."
    required: true
  cloudfront-domain:
    description: "CloudFront domain name (for summary output)."
    required: true
  chat-endpoint:
    description: "Chat API Gateway endpoint URL to inject into the frontend."
    required: true

runs:
  using: composite
  steps:
    - name: Configure AWS Credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Inject API Endpoint & Sync Frontend to S3
      shell: bash
      run: |
        echo "Injecting API endpoint: ${{ inputs.chat-endpoint }}"
        echo "window.CHATBOT_API_ENDPOINT = '${{ inputs.chat-endpoint }}';" \
          > ./frontend/js/config.js

        aws s3 sync ./frontend \
          "s3://${{ inputs.frontend-bucket }}" \
          --delete --no-progress
        echo "Frontend synced to s3://${{ inputs.frontend-bucket }}"

    - name: Invalidate CloudFront Cache
      shell: bash
      run: |
        INVALIDATION_ID=$(aws cloudfront create-invalidation \
          --distribution-id "${{ inputs.cloudfront-id }}" \
          --paths "/*" \
          --query 'Invalidation.Id' \
          --output text \
          --no-cli-pager)
        echo "CloudFront cache invalidated: $INVALIDATION_ID"
        echo ""
        echo "=========================================================="
        echo "  Web Chatbot UI  : https://${{ inputs.cloudfront-domain }}"
        echo "  API Endpoint    : ${{ inputs.chat-endpoint }}"
        echo "=========================================================="
