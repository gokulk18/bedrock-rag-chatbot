name: "Deploy Lambda Functions"
description: "Packages and updates the ingestion and query Lambda function code."

inputs:
  aws-role-arn:
    description: "IAM role ARN to assume for Lambda deployments."
    required: true
  aws-region:
    description: "AWS region."
    required: true
  ingestion-function:
    description: "Name of the ingestion Lambda function."
    required: true
  query-function:
    description: "Name of the query Lambda function."
    required: true

runs:
  using: composite
  steps:
    - name: Configure AWS Credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Package & Deploy Ingestion Lambda
      shell: bash
      run: |
        cd backend/ingestion
        zip -r ingestion.zip index.py
        aws lambda update-function-code \
          --function-name "${{ inputs.ingestion-function }}" \
          --zip-file fileb://ingestion.zip \
          --no-cli-pager
        echo "Ingestion Lambda updated."

    - name: Package & Deploy Query Lambda
      shell: bash
      run: |
        cd backend/query
        zip -r query.zip index.py
        aws lambda update-function-code \
          --function-name "${{ inputs.query-function }}" \
          --zip-file fileb://query.zip \
          --no-cli-pager
        echo "Query Lambda updated."

    - name: Wait for Lambda Updates to Propagate
      shell: bash
      run: |
        echo "Waiting for Lambda functions to become active..."
        aws lambda wait function-updated \
          --function-name "${{ inputs.ingestion-function }}" --no-cli-pager
        aws lambda wait function-updated \
          --function-name "${{ inputs.query-function }}" --no-cli-pager
        echo "Both Lambda functions are active and ready."
