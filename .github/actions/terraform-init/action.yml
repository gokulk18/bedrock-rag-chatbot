name: "Terraform Init"
description: "Ensures the S3 state bucket exists, then runs terraform init."

inputs:
  working-directory:
    description: "Directory containing Terraform configuration."
    required: true
  state-bucket:
    description: "Name of the S3 bucket used for remote state."
    required: true
  aws-region:
    description: "AWS region of the state bucket."
    required: true

runs:
  using: composite
  steps:
    - name: Ensure Terraform State Bucket Exists
      shell: bash
      env:
        BUCKET: ${{ inputs.state-bucket }}
        REGION: ${{ inputs.aws-region }}
      run: |
        if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
          echo "State bucket '$BUCKET' already exists — skipping creation."
        else
          echo "Creating state bucket: $BUCKET"
          aws s3api create-bucket \
            --bucket "$BUCKET" \
            --region "$REGION" \
            --no-cli-pager
          aws s3api put-bucket-versioning \
            --bucket "$BUCKET" \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption \
            --bucket "$BUCKET" \
            --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          aws s3api put-public-access-block \
            --bucket "$BUCKET" \
            --public-access-block-configuration \
              "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          echo "State bucket '$BUCKET' created and secured."
        fi

    - name: Terraform Init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform init
