name: "Terraform Plan"
description: "Validates, generates binary plan artifact (-out=tfplan), uploads artifact, and writes summary."

inputs:
  working-directory:
    description: "Directory containing Terraform configuration."
    required: true
  destroy:
    description: "Set to 'true' to run plan -destroy."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Terraform Validate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform validate

    - name: Terraform Plan
      id: plan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ "${{ inputs.destroy }}" = "true" ]; then
          echo "Running destroy plan..."
          terraform plan -destroy -no-color -out=tfplan | tee plan_output.txt
        else
          echo "Running plan..."
          terraform plan -no-color -out=tfplan | tee plan_output.txt
        fi

        echo "Writing plan output to job summary..."
        echo "### 📋 Terraform Plan Summary" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`hcl" >> $GITHUB_STEP_SUMMARY
        tail -n 100 plan_output.txt >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

    - name: Upload Plan Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tfplan
        path: ${{ inputs.working-directory }}/tfplan
        retention-days: 7
