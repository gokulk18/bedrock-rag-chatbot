name: "Setup Terraform"
description: "Checks out the repository, installs Terraform, and authenticates to AWS via OIDC."

inputs:
  terraform-version:
    description: "Terraform CLI version to install."
    required: true
  aws-role-arn:
    description: "IAM role ARN to assume via OIDC."
    required: true
  aws-region:
    description: "AWS region."
    required: true

runs:
  using: composite
  steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Terraform ${{ inputs.terraform-version }}
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - name: Configure AWS Credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}
