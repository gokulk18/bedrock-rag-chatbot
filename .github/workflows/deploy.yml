name: Full Infrastructure & Application Deploy

# =============================================================================
# Single unified pipeline:
#   1. terraform  → provisions all AWS infrastructure, exports bucket/CDN IDs
#   2. lambda     → packages & deploys Lambda functions (runs after terraform)
#   3. frontend   → syncs S3 + invalidates CloudFront (runs after terraform)
#
# No GitHub Secrets needed for infrastructure values — they are captured
# directly from Terraform outputs and passed between jobs automatically.
# =============================================================================
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  id-token: write   # Required for OIDC token generation
  contents: read    # Required for checkout

env:
  TF_IN_AUTOMATION: "true"
  TERRAFORM_VERSION: "1.15.4"
  AWS_REGION: "us-east-1"
  STATE_BUCKET: "bedrock-rag-chatbot-dev-tfstate"
  TERRAFORM_ROLE: "arn:aws:iam::902664897239:role/github-actions-terraform-role"
  LAMBDA_ROLE:    "arn:aws:iam::902664897239:role/github-actions-lambda-role"
  FRONTEND_ROLE:  "arn:aws:iam::902664897239:role/github-actions-frontend-role"
  INGESTION_FUNCTION: "bedrock-rag-chatbot-dev-ingestion"
  QUERY_FUNCTION:     "bedrock-rag-chatbot-dev-query"

jobs:
  # ---------------------------------------------------------------------------
  # Job 0: Bootstrap — create the Terraform remote state S3 bucket if missing.
  # This is idempotent: safe to run even if the bucket already exists.
  # ---------------------------------------------------------------------------
  bootstrap:
    name: "0. Bootstrap State Bucket"
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TERRAFORM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure Terraform State Bucket Exists
        run: |
          BUCKET="${{ env.STATE_BUCKET }}"
          REGION="${{ env.AWS_REGION }}"

          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "State bucket '$BUCKET' already exists. Skipping creation."
          else
            echo "Creating state bucket: $BUCKET"
            aws s3api create-bucket \
              --bucket "$BUCKET" \
              --region "$REGION" \
              --no-cli-pager

            echo "Enabling versioning..."
            aws s3api put-bucket-versioning \
              --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled

            echo "Enabling AES256 encryption..."
            aws s3api put-bucket-encryption \
              --bucket "$BUCKET" \
              --server-side-encryption-configuration '{
                "Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]
              }'

            echo "Blocking all public access..."
            aws s3api put-public-access-block \
              --bucket "$BUCKET" \
              --public-access-block-configuration \
                "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"

            echo "State bucket '$BUCKET' created and secured."
          fi

  # ---------------------------------------------------------------------------
  # Job 1: Terraform — plan + apply, then export outputs to subsequent jobs
  # ---------------------------------------------------------------------------
  terraform:
    name: "1. Terraform Plan & Apply"
    runs-on: ubuntu-latest
    needs: bootstrap


    # Export terraform output values so jobs 2 & 3 can use them directly
    outputs:
      frontend_bucket:  ${{ steps.tf_out.outputs.frontend_bucket }}
      cloudfront_id:    ${{ steps.tf_out.outputs.cloudfront_id }}
      chat_endpoint:    ${{ steps.tf_out.outputs.chat_endpoint }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform ${{ env.TERRAFORM_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TERRAFORM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -no-color

      # -----------------------------------------------------------------------
      # Phase 1: Apply ONLY the OpenSearch collection first.
      # Bedrock Knowledge Base requires the vector index to exist before it
      # can be created, but the index must be created via the OpenSearch API
      # after the collection is active — not by Terraform.
      # -----------------------------------------------------------------------
      - name: "Phase 1: Apply OpenSearch Collection"
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -target=module.opensearch.aws_opensearchserverless_security_policy.encryption \
            -target=module.opensearch.aws_opensearchserverless_security_policy.network \
            -target=module.opensearch.aws_opensearchserverless_collection.this \
            -target=module.opensearch.aws_opensearchserverless_access_policy.this
          echo "OpenSearch collection created."

      - name: "Phase 1b: Wait for OpenSearch Collection to be Active"
        run: |
          cd terraform
          COLLECTION_NAME="bedrock-rag-chatbot-dev-vec"
          echo "Waiting for collection '$COLLECTION_NAME' to become ACTIVE..."
          for i in {1..30}; do
            STATUS=$(aws opensearchserverless list-collections \
              --collection-filters name=$COLLECTION_NAME \
              --query 'collectionSummaries[0].status' \
              --output text --no-cli-pager 2>/dev/null)
            echo "Attempt $i: status = $STATUS"
            if [ "$STATUS" = "ACTIVE" ]; then
              echo "Collection is ACTIVE."
              break
            fi
            sleep 10
          done

      - name: "Phase 1c: Create Required Vector Index in OpenSearch"
        run: |
          COLLECTION_ENDPOINT=$(cd terraform && terraform output -raw opensearch_collection_endpoint)
          echo "Collection endpoint: $COLLECTION_ENDPOINT"

          # Get AWS credentials for signing the request
          AWS_SIG=$(aws sts get-caller-identity --query Account --output text)

          # Create the vector index required by Bedrock Knowledge Base
          curl -sS --request PUT \
            --url "${COLLECTION_ENDPOINT}/bedrock-knowledge-base-default-index" \
            --header "Content-Type: application/json" \
            --aws-sigv4 "aws:amz:us-east-1:aoss" \
            --user "${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}" \
            -H "x-amz-security-token: ${AWS_SESSION_TOKEN}" \
            --data '{
              "settings": {
                "index": {
                  "knn": true,
                  "knn.algo_param.ef_search": 512
                }
              },
              "mappings": {
                "properties": {
                  "bedrock-knowledge-base-default-vector": {
                    "type": "knn_vector",
                    "dimension": 1024,
                    "method": {
                      "name": "hnsw",
                      "engine": "faiss",
                      "space_type": "l2",
                      "parameters": {
                        "ef_construction": 512,
                        "m": 16
                      }
                    }
                  },
                  "AMAZON_BEDROCK_TEXT_CHUNK": { "type": "text" },
                  "AMAZON_BEDROCK_METADATA": { "type": "text", "index": false }
                }
              }
            }' || echo "Index may already exist — continuing."
          echo "Vector index creation attempted."

      # -----------------------------------------------------------------------
      # Phase 2: Apply all remaining resources now that the index exists.
      # -----------------------------------------------------------------------
      - name: "Phase 2: Full Terraform Apply"
        working-directory: terraform
        run: terraform apply -auto-approve


      # Capture outputs and make them available to downstream jobs
      - name: Capture Terraform Outputs
        id: tf_out
        working-directory: terraform
        run: |
          FRONTEND_BUCKET=$(terraform output -raw frontend_bucket_name)
          CLOUDFRONT_ID=$(terraform output -raw cloudfront_distribution_id)
          CHAT_ENDPOINT=$(terraform output -raw chat_endpoint_url)

          echo "frontend_bucket=$FRONTEND_BUCKET" >> $GITHUB_OUTPUT
          echo "cloudfront_id=$CLOUDFRONT_ID"     >> $GITHUB_OUTPUT
          echo "chat_endpoint=$CHAT_ENDPOINT"     >> $GITHUB_OUTPUT

          echo ""
          echo "=========================================="
          echo "Infrastructure Deployed Successfully"
          echo "=========================================="
          echo "Frontend S3 Bucket : $FRONTEND_BUCKET"
          echo "CloudFront ID      : $CLOUDFRONT_ID"
          echo "Chat API Endpoint  : $CHAT_ENDPOINT"
          echo "=========================================="

  # ---------------------------------------------------------------------------
  # Job 2: Lambda — deploy backend code (waits for terraform to finish)
  # ---------------------------------------------------------------------------
  lambda:
    name: "2. Deploy Lambda Functions"
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.LAMBDA_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package & Deploy Ingestion Lambda
        run: |
          cd backend/ingestion
          zip -r ingestion.zip index.py
          aws lambda update-function-code \
            --function-name ${{ env.INGESTION_FUNCTION }} \
            --zip-file fileb://ingestion.zip \
            --no-cli-pager
          echo "Ingestion Lambda deployed."

      - name: Package & Deploy Query Lambda
        run: |
          cd backend/query
          zip -r query.zip index.py
          aws lambda update-function-code \
            --function-name ${{ env.QUERY_FUNCTION }} \
            --zip-file fileb://query.zip \
            --no-cli-pager
          echo "Query Lambda deployed."

      - name: Wait for Lambda Updates to Complete
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.INGESTION_FUNCTION }} --no-cli-pager
          aws lambda wait function-updated \
            --function-name ${{ env.QUERY_FUNCTION }} --no-cli-pager
          echo "Both Lambda functions are active and ready."

  # ---------------------------------------------------------------------------
  # Job 3: Frontend — sync S3 + invalidate CloudFront
  # Uses frontend_bucket and cloudfront_id directly from terraform job outputs
  # ---------------------------------------------------------------------------
  frontend:
    name: "3. Deploy Frontend"
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.FRONTEND_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync Frontend to S3
        run: |
          aws s3 sync ./frontend \
            s3://${{ needs.terraform.outputs.frontend_bucket }} \
            --delete --no-progress
          echo "Frontend synced to: s3://${{ needs.terraform.outputs.frontend_bucket }}"

      - name: Invalidate CloudFront Cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ needs.terraform.outputs.cloudfront_id }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text \
            --no-cli-pager)
          echo "CloudFront cache invalidated: $INVALIDATION_ID"
          echo "Your app is live at: https://${{ needs.terraform.outputs.chat_endpoint }}"
