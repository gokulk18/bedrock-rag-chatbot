name: Infrastructure & Application Pipeline

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        type: choice
        options: [plan, apply, destroy]
        default: plan

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION:   "true"
  TERRAFORM_VERSION:  "1.15.4"
  AWS_REGION:         "us-east-1"
  STATE_BUCKET:       "bedrock-rag-chatbot-dev-tfstate"
  TERRAFORM_ROLE:     "arn:aws:iam::902664897239:role/github-actions-terraform-role"
  LAMBDA_ROLE:        "arn:aws:iam::902664897239:role/github-actions-lambda-role"
  FRONTEND_ROLE:      "arn:aws:iam::902664897239:role/github-actions-frontend-role"
  INGESTION_FUNCTION: "bedrock-rag-chatbot-dev-ingestion"
  QUERY_FUNCTION:     "bedrock-rag-chatbot-dev-query"
  RESOURCE_PREFIX:    "bedrock-rag-chatbot"

jobs:

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TERRAFORM_ROLE }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Terraform Init
        uses: ./.github/actions/terraform-init
        with:
          working-directory: terraform
          state-bucket:      ${{ env.STATE_BUCKET }}
          aws-region:        ${{ env.AWS_REGION }}

      - name: Terraform Plan
        uses: ./.github/actions/terraform-plan
        with:
          working-directory: terraform
          destroy: ${{ github.event.inputs.action == 'destroy' }}

  apply:
    name: Terraform Apply/Destroy
    needs: plan
    if: ${{ github.event.inputs.action != 'plan' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform

    outputs:
      frontend_bucket:   ${{ steps.tf_apply.outputs.frontend_bucket }}
      cloudfront_id:     ${{ steps.tf_apply.outputs.cloudfront_id }}
      cloudfront_domain: ${{ steps.tf_apply.outputs.cloudfront_domain }}
      chat_endpoint:     ${{ steps.tf_apply.outputs.chat_endpoint }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TERRAFORM_ROLE }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Terraform Init
        uses: ./.github/actions/terraform-init
        with:
          working-directory: terraform
          state-bucket:      ${{ env.STATE_BUCKET }}
          aws-region:        ${{ env.AWS_REGION }}

      - name: Terraform Apply
        id: tf_apply
        if: ${{ github.event.inputs.action == 'apply' }}
        uses: ./.github/actions/terraform-apply
        with:
          working-directory: terraform
          aws-region:        ${{ env.AWS_REGION }}

      - name: Terraform Destroy
        if: ${{ github.event.inputs.action == 'destroy' }}
        uses: ./.github/actions/terraform-destroy
        with:
          working-directory: terraform
          aws-region:        ${{ env.AWS_REGION }}
          state-bucket:      ${{ env.STATE_BUCKET }}
          resource-prefix:   ${{ env.RESOURCE_PREFIX }}

      # Print deployment URL to workflow summary (apply only)
      - name: Deployment Summary
        if: ${{ github.event.inputs.action == 'apply' }}
        shell: bash
        run: |
          DOMAIN="${{ steps.tf_apply.outputs.cloudfront_domain }}"
          ENDPOINT="${{ steps.tf_apply.outputs.chat_endpoint }}"
          echo "## ✅ Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Application URL | https://$DOMAIN |" >> $GITHUB_STEP_SUMMARY
          echo "| 📡 Chat API Endpoint | $ENDPOINT |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Access your app:** [https://$DOMAIN](https://$DOMAIN)" >> $GITHUB_STEP_SUMMARY

  lambda:
    name: Deploy Lambda Functions
    needs: apply
    if: ${{ github.event.inputs.action == 'apply' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Lambda Functions
        uses: ./.github/actions/lambda-deploy
        with:
          aws-role-arn:       ${{ env.LAMBDA_ROLE }}
          aws-region:         ${{ env.AWS_REGION }}
          ingestion-function: ${{ env.INGESTION_FUNCTION }}
          query-function:     ${{ env.QUERY_FUNCTION }}

  frontend:
    name: Deploy Frontend
    needs: apply
    if: ${{ github.event.inputs.action == 'apply' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Frontend
        uses: ./.github/actions/frontend-deploy
        with:
          aws-role-arn:      ${{ env.FRONTEND_ROLE }}
          aws-region:        ${{ env.AWS_REGION }}
          frontend-bucket:   ${{ needs.apply.outputs.frontend_bucket }}
          cloudfront-id:     ${{ needs.apply.outputs.cloudfront_id }}
          cloudfront-domain: ${{ needs.apply.outputs.cloudfront_domain }}
          chat-endpoint:     ${{ needs.apply.outputs.chat_endpoint }}

  # ---------------------------------------------------------------------------
  # summary — final deployment notice printed after lambda + frontend both done
  # ---------------------------------------------------------------------------
  summary:
    name: Deployment Summary
    needs: [apply, lambda, frontend]
    if: ${{ github.event.inputs.action == 'apply' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Print Application URL
        shell: bash
        run: |
          DOMAIN="${{ needs.apply.outputs.cloudfront_domain }}"
          ENDPOINT="${{ needs.apply.outputs.chat_endpoint }}"
          echo ""
          echo "╔══════════════════════════════════════════════════════╗"
          echo "║          🚀  DEPLOYMENT COMPLETE                     ║"
          echo "╠══════════════════════════════════════════════════════╣"
          echo "║  🌐  App URL  : https://$DOMAIN"
          echo "║  📡  API      : $ENDPOINT"
          echo "╚══════════════════════════════════════════════════════╝"
          echo ""

      - name: Write to Job Summary
        shell: bash
        run: |
          DOMAIN="${{ needs.apply.outputs.cloudfront_domain }}"
          ENDPOINT="${{ needs.apply.outputs.chat_endpoint }}"
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 **Application URL** | [https://$DOMAIN](https://$DOMAIN) |" >> $GITHUB_STEP_SUMMARY
          echo "| 📡 **Chat API** | \`$ENDPOINT\` |" >> $GITHUB_STEP_SUMMARY
