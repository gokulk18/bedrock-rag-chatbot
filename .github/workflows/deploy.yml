name: Infrastructure & Application Pipeline

# =============================================================================
# Manual workflow dispatch with action dropdown: plan | apply | destroy
#
#  plan    → validate + show what Terraform would change (no mutations)
#  apply   → deploy infrastructure, then Lambda & frontend in parallel
#  destroy → tear down all infrastructure (Terraform first, then cleanup)
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to execute"
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
          - destroy

concurrency:
  group: terraform-${{ github.ref }}-${{ github.event.inputs.action }}
  cancel-in-progress: false

permissions:
  id-token: write   # Required for OIDC token generation
  contents: read    # Required for checkout

env:
  TF_IN_AUTOMATION:   "true"
  TERRAFORM_VERSION:  "1.15.4"
  AWS_REGION:         "us-east-1"
  STATE_BUCKET:       "bedrock-rag-chatbot-dev-tfstate"
  TERRAFORM_ROLE:     "arn:aws:iam::902664897239:role/github-actions-terraform-role"
  LAMBDA_ROLE:        "arn:aws:iam::902664897239:role/github-actions-lambda-role"
  FRONTEND_ROLE:      "arn:aws:iam::902664897239:role/github-actions-frontend-role"
  INGESTION_FUNCTION: "bedrock-rag-chatbot-dev-ingestion"
  QUERY_FUNCTION:     "bedrock-rag-chatbot-dev-query"
  RESOURCE_PREFIX:    "bedrock-rag-chatbot"

jobs:

  # ---------------------------------------------------------------------------
  # plan — show what Terraform would do (no infrastructure changes)
  # ---------------------------------------------------------------------------
  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.action == 'plan' }}

    steps:
      - name: Setup (checkout + Terraform + AWS auth)
        uses: ./.github/actions/terraform-setup
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          aws-role-arn:      ${{ env.TERRAFORM_ROLE }}
          aws-region:        ${{ env.AWS_REGION }}

      - name: Terraform Init
        uses: ./.github/actions/terraform-init
        with:
          working-directory: terraform
          state-bucket:      ${{ env.STATE_BUCKET }}
          aws-region:        ${{ env.AWS_REGION }}

      - name: Terraform Plan
        uses: ./.github/actions/terraform-plan
        with:
          working-directory: terraform
          destroy:           "false"

  # ---------------------------------------------------------------------------
  # apply — provision / update all infrastructure
  # ---------------------------------------------------------------------------
  apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.action == 'apply' }}

    outputs:
      frontend_bucket:   ${{ steps.tf_apply.outputs.frontend_bucket }}
      cloudfront_id:     ${{ steps.tf_apply.outputs.cloudfront_id }}
      cloudfront_domain: ${{ steps.tf_apply.outputs.cloudfront_domain }}
      chat_endpoint:     ${{ steps.tf_apply.outputs.chat_endpoint }}

    steps:
      - name: Setup (checkout + Terraform + AWS auth)
        uses: ./.github/actions/terraform-setup
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          aws-role-arn:      ${{ env.TERRAFORM_ROLE }}
          aws-region:        ${{ env.AWS_REGION }}

      - name: Terraform Init
        uses: ./.github/actions/terraform-init
        with:
          working-directory: terraform
          state-bucket:      ${{ env.STATE_BUCKET }}
          aws-region:        ${{ env.AWS_REGION }}

      - name: Terraform Apply
        id: tf_apply
        uses: ./.github/actions/terraform-apply
        with:
          working-directory: terraform
          aws-region:        ${{ env.AWS_REGION }}

  # ---------------------------------------------------------------------------
  # lambda — deploy Lambda code (runs after apply, in parallel with frontend)
  # ---------------------------------------------------------------------------
  lambda:
    name: "Deploy Lambda Functions"
    runs-on: ubuntu-latest
    needs: apply
    if: ${{ github.event.inputs.action == 'apply' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Lambda Functions
        uses: ./.github/actions/lambda-deploy
        with:
          aws-role-arn:        ${{ env.LAMBDA_ROLE }}
          aws-region:          ${{ env.AWS_REGION }}
          ingestion-function:  ${{ env.INGESTION_FUNCTION }}
          query-function:      ${{ env.QUERY_FUNCTION }}

  # ---------------------------------------------------------------------------
  # frontend — sync UI assets to S3 + invalidate CloudFront (parallel with lambda)
  # ---------------------------------------------------------------------------
  frontend:
    name: "Deploy Frontend"
    runs-on: ubuntu-latest
    needs: apply
    if: ${{ github.event.inputs.action == 'apply' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Frontend
        uses: ./.github/actions/frontend-deploy
        with:
          aws-role-arn:      ${{ env.FRONTEND_ROLE }}
          aws-region:        ${{ env.AWS_REGION }}
          frontend-bucket:   ${{ needs.apply.outputs.frontend_bucket }}
          cloudfront-id:     ${{ needs.apply.outputs.cloudfront_id }}
          cloudfront-domain: ${{ needs.apply.outputs.cloudfront_domain }}
          chat-endpoint:     ${{ needs.apply.outputs.chat_endpoint }}

  # ---------------------------------------------------------------------------
  # destroy — tear down all infrastructure (correct order: tf destroy → cleanup)
  # ---------------------------------------------------------------------------
  destroy:
    name: "Terraform Destroy"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.action == 'destroy' }}

    steps:
      - name: Setup (checkout + Terraform + AWS auth)
        uses: ./.github/actions/terraform-setup
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          aws-role-arn:      ${{ env.TERRAFORM_ROLE }}
          aws-region:        ${{ env.AWS_REGION }}

      - name: Terraform Init
        uses: ./.github/actions/terraform-init
        with:
          working-directory: terraform
          state-bucket:      ${{ env.STATE_BUCKET }}
          aws-region:        ${{ env.AWS_REGION }}

      - name: Terraform Destroy
        uses: ./.github/actions/terraform-destroy
        with:
          working-directory: terraform
          aws-region:        ${{ env.AWS_REGION }}
          state-bucket:      ${{ env.STATE_BUCKET }}
          resource-prefix:   ${{ env.RESOURCE_PREFIX }}
