name: Frontend Web UI CI/CD

# =============================================================================
# Triggers:
# - push to main when frontend files change
# - workflow_dispatch (manual trigger)
# =============================================================================
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'

permissions:
  id-token: write   # Required for OIDC token generation
  contents: read    # Required for checkout

env:
  AWS_REGION: "us-east-1"
  ROLE_TO_ASSUME: "arn:aws:iam::902664897239:role/github-actions-frontend-role"

jobs:
  deploy-frontend:
    name: Sync S3 & Invalidate CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # -----------------------------------------------------------------------
      # Sync frontend static assets to S3
      # --delete removes files from S3 that no longer exist locally
      # -----------------------------------------------------------------------
      - name: Sync Static Assets to S3 Frontend Bucket
        run: |
          aws s3 sync ./frontend s3://${{ secrets.FRONTEND_BUCKET_NAME }} \
            --delete \
            --no-progress
          echo "Frontend assets synced to s3://${{ secrets.FRONTEND_BUCKET_NAME }}"

      # -----------------------------------------------------------------------
      # Invalidate CloudFront edge cache so users get the latest version
      # -----------------------------------------------------------------------
      - name: Invalidate CloudFront Edge Cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text \
            --no-cli-pager)
          echo "CloudFront invalidation created: $INVALIDATION_ID"

      - name: Wait for CloudFront Invalidation
        run: |
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --id $INVALIDATION_ID \
            --no-cli-pager || echo "Invalidation wait skipped (may still be propagating)"
          echo "Frontend deployment complete."
