name: Lambda Application CI/CD

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/lambda-deploy.yml'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  ROLE_TO_ASSUME: "arn:aws:iam::902664897239:role/github-actions-lambda-role"
  INGESTION_FUNCTION_NAME: "bedrock-rag-chatbot-dev-ingestion"
  QUERY_FUNCTION_NAME: "bedrock-rag-chatbot-dev-query"

jobs:
  deploy-backend:
    name: Package & Deploy Python Lambdas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # -----------------------------------------------------------------------
      # Package and deploy directly via ZIP (no S3 bucket required)
      # -----------------------------------------------------------------------
      - name: Package & Deploy Ingestion Lambda
        run: |
          cd backend/ingestion
          zip -r ingestion.zip index.py
          aws lambda update-function-code \
            --function-name ${{ env.INGESTION_FUNCTION_NAME }} \
            --zip-file fileb://ingestion.zip \
            --no-cli-pager
          echo "Ingestion Lambda deployed."

      - name: Package & Deploy Query Lambda
        run: |
          cd backend/query
          zip -r query.zip index.py
          aws lambda update-function-code \
            --function-name ${{ env.QUERY_FUNCTION_NAME }} \
            --zip-file fileb://query.zip \
            --no-cli-pager
          echo "Query Lambda deployed."

      # -----------------------------------------------------------------------
      # Wait for updates to complete before finishing
      # -----------------------------------------------------------------------
      - name: Wait for Ingestion Lambda to be Active
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.INGESTION_FUNCTION_NAME }} \
            --no-cli-pager
          echo "Ingestion Lambda is active."

      - name: Wait for Query Lambda to be Active
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.QUERY_FUNCTION_NAME }} \
            --no-cli-pager
          echo "Query Lambda is active."
