name: Lambda Application CI/CD

# =============================================================================
# Triggers:
# - push to main when backend code changes
# - workflow_dispatch (manual trigger)
# =============================================================================
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/lambda-deploy.yml'

permissions:
  id-token: write   # Required for OIDC token generation
  contents: read    # Required for checkout

env:
  AWS_REGION: "us-east-1"
  ROLE_TO_ASSUME: "arn:aws:iam::902664897239:role/github-actions-lambda-role"
  INGESTION_FUNCTION_NAME: "bedrock-rag-chatbot-dev-ingestion"
  QUERY_FUNCTION_NAME: "bedrock-rag-chatbot-dev-query"

jobs:
  deploy-backend:
    name: Package & Deploy Python Lambdas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # -----------------------------------------------------------------------
      # Package Lambda ZIPs
      # -----------------------------------------------------------------------
      - name: Package Ingestion Lambda
        run: |
          cd backend/ingestion
          zip -r ingestion.zip index.py
          echo "Ingestion ZIP size: $(du -sh ingestion.zip | cut -f1)"

      - name: Package Query Lambda
        run: |
          cd backend/query
          zip -r query.zip index.py
          echo "Query ZIP size: $(du -sh query.zip | cut -f1)"

      # -----------------------------------------------------------------------
      # Upload Build Artifacts to S3
      # -----------------------------------------------------------------------
      - name: Upload Build Artifacts to S3
        run: |
          aws s3 cp backend/ingestion/ingestion.zip \
            s3://${{ secrets.ARTIFACTS_BUCKET_NAME }}/builds/ingestion-${{ github.sha }}.zip
          aws s3 cp backend/query/query.zip \
            s3://${{ secrets.ARTIFACTS_BUCKET_NAME }}/builds/query-${{ github.sha }}.zip
          echo "Artifacts uploaded with SHA: ${{ github.sha }}"

      # -----------------------------------------------------------------------
      # Update Lambda Function Code
      # -----------------------------------------------------------------------
      - name: Deploy Ingestion Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.INGESTION_FUNCTION_NAME }} \
            --s3-bucket ${{ secrets.ARTIFACTS_BUCKET_NAME }} \
            --s3-key builds/ingestion-${{ github.sha }}.zip \
            --no-cli-pager
          echo "Ingestion Lambda updated."

      - name: Deploy Query Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.QUERY_FUNCTION_NAME }} \
            --s3-bucket ${{ secrets.ARTIFACTS_BUCKET_NAME }} \
            --s3-key builds/query-${{ github.sha }}.zip \
            --no-cli-pager
          echo "Query Lambda updated."

      # -----------------------------------------------------------------------
      # Wait for update to complete before confirming
      # -----------------------------------------------------------------------
      - name: Wait for Ingestion Lambda Update
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.INGESTION_FUNCTION_NAME }} \
            --no-cli-pager
          echo "Ingestion Lambda ready."

      - name: Wait for Query Lambda Update
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.QUERY_FUNCTION_NAME }} \
            --no-cli-pager
          echo "Query Lambda ready."
