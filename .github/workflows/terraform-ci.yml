name: Terraform Infrastructure CI/CD

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - 'bootstrap/**'
      - '.github/workflows/terraform-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - 'bootstrap/**'
      - '.github/workflows/terraform-ci.yml'

permissions:
  id-token: write   # Required for OIDC token generation
  contents: read    # Required for checkout

env:
  TF_IN_AUTOMATION: "true"
  TERRAFORM_VERSION: "1.15.4"
  AWS_REGION: "us-east-1"
  ROLE_TO_ASSUME: "arn:aws:iam::902664897239:role/github-actions-terraform-role"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Validate & Plan (runs on every push + PR)
  # ---------------------------------------------------------------------------
  plan:
    name: Terraform Format / Validate / Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform ${{ env.TERRAFORM_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -no-color -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 2: Apply (only on push/dispatch to main — never on PRs)
  # ---------------------------------------------------------------------------
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform ${{ env.TERRAFORM_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      # -----------------------------------------------------------------------
      # After apply: extract Terraform outputs and push them to GitHub Secrets
      # automatically. This means destroy+apply never requires manual updates.
      # -----------------------------------------------------------------------
      - name: Extract Terraform Outputs
        id: tf_outputs
        working-directory: terraform
        run: |
          echo "Extracting Terraform outputs..."
          FRONTEND_BUCKET=$(terraform output -raw frontend_bucket_name)
          CLOUDFRONT_ID=$(terraform output -raw cloudfront_distribution_id)
          CHAT_URL=$(terraform output -raw chat_endpoint_url)
          echo "frontend_bucket=$FRONTEND_BUCKET" >> $GITHUB_OUTPUT
          echo "cloudfront_id=$CLOUDFRONT_ID" >> $GITHUB_OUTPUT
          echo "chat_url=$CHAT_URL" >> $GITHUB_OUTPUT
          echo ""
          echo "=== Deployed Infrastructure ==="
          echo "Frontend Bucket:         $FRONTEND_BUCKET"
          echo "CloudFront ID:           $CLOUDFRONT_ID"
          echo "Chat API Endpoint:       $CHAT_URL"

      - name: Auto-Update GitHub Secrets from Terraform Outputs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "Updating GitHub Secrets with latest Terraform outputs..."
          gh secret set FRONTEND_BUCKET_NAME \
            --body "${{ steps.tf_outputs.outputs.frontend_bucket }}" \
            --repo "${{ github.repository }}"
          gh secret set CLOUDFRONT_DISTRIBUTION_ID \
            --body "${{ steps.tf_outputs.outputs.cloudfront_id }}" \
            --repo "${{ github.repository }}"
          echo "GitHub Secrets updated successfully."
          echo ""
          echo "FRONTEND_BUCKET_NAME    → ${{ steps.tf_outputs.outputs.frontend_bucket }}"
          echo "CLOUDFRONT_DISTRIBUTION_ID → ${{ steps.tf_outputs.outputs.cloudfront_id }}"
