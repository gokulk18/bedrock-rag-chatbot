name: OIDC Connection Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  ROLE_TO_ASSUME: "arn:aws:iam::902664897239:role/github-actions-terraform-role"

jobs:
  test-oidc:
    name: Test AWS OIDC Authentication
    runs-on: ubuntu-latest

    steps:
      - name: Decode OIDC Token to See Exact Sub Claim
        run: |
          echo "Fetching OIDC token from GitHub..."
          OIDC_TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')
          echo ""
          echo "=== OIDC Token Claims (decoded) ==="
          echo $OIDC_TOKEN | cut -d'.' -f2 | base64 -d 2>/dev/null | python3 -m json.tool || \
          echo $OIDC_TOKEN | cut -d'.' -f2 | base64 --decode 2>/dev/null | python3 -m json.tool
          echo "=== End of Claims ==="

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity (Confirms OIDC Worked)
        run: aws sts get-caller-identity

