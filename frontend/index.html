<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon Bedrock RAG Chatbot</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <div class="header-logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <h1>Amazon Bedrock RAG Assistant</h1>
      </div>
      <div class="session-badge">
        <span>Session:</span>
        <span id="session-id-display">Connecting...</span>
      </div>
    </header>

    <main class="chat-messages" id="chat-messages">
      <div class="message assistant-message welcome-card">
        <div class="message-content">
          <h3>Welcome to the Bedrock RAG Chatbot! 👋</h3>
          <p>Ask me anything about your uploaded documents. I will synthesize answers using Amazon Bedrock Knowledge Base and provide exact citations.</p>
        </div>
      </div>
    </main>

    <footer class="chat-input-container">
      <form id="chat-form" class="chat-form">
        <input 
          type="text" 
          id="user-input" 
          placeholder="Ask a question about your knowledge base documents..." 
          autocomplete="off"
          required
        >
        <button type="submit" id="send-btn" aria-label="Send message">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
