<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nova AI — Bedrock-powered RAG chatbot with knowledge base search and conversational history.">
  <title>Nova AI — Bedrock Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  
  <div class="app-shell" id="app-shell">

    
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              <path d="M2 17l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              <path d="M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="brand-name">Nova AI</span>
        </div>
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar" title="Toggle sidebar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
      </div>

      <button class="new-chat-btn" id="new-chat-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <span>New Chat</span>
      </button>

      <div class="history-section">
        <p class="history-label">Recents</p>
        <div class="history-list" id="history-list">
          
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="model-badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          Amazon Nova Pro
        </div>
      </div>
    </aside>

    
    <div class="main-content">

      
      <header class="topbar">
        <button class="topbar-toggle" id="topbar-toggle" aria-label="Toggle sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div class="topbar-title" id="topbar-title">New conversation</div>
        <div class="topbar-actions">
          <button class="icon-btn" id="clear-chat-btn" title="Clear current chat">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
              <path d="M10 11v6M14 11v6"/>
              <path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
            </svg>
          </button>
        </div>
      </header>

      
      <main class="chat-area" id="chat-area">

        
        <div class="welcome-screen" id="welcome-screen">
          <div class="welcome-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
              <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="url(#grad1)" stroke-width="1.5" stroke-linejoin="round"/>
              <path d="M2 17l10 5 10-5" stroke="url(#grad1)" stroke-width="1.5" stroke-linejoin="round"/>
              <path d="M2 12l10 5 10-5" stroke="url(#grad1)" stroke-width="1.5" stroke-linejoin="round"/>
              <defs>
                <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" style="stop-color:#6366f1"/>
                  <stop offset="100%" style="stop-color:#a855f7"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <h1 class="welcome-title">How can I help you today?</h1>
          <p class="welcome-sub">Powered by Amazon Nova Pro · Ask anything about your knowledge base</p>
          <div class="suggestion-grid">
            <button class="suggestion-chip" data-prompt="Summarize the key topics in the knowledge base">
              <span class="chip-icon">📋</span>
              <span>Summarize key topics</span>
            </button>
            <button class="suggestion-chip" data-prompt="What are the main concepts covered in the documents?">
              <span class="chip-icon">💡</span>
              <span>Main concepts covered</span>
            </button>
            <button class="suggestion-chip" data-prompt="Give me a quick overview of what's in the knowledge base">
              <span class="chip-icon">🔍</span>
              <span>Knowledge base overview</span>
            </button>
            <button class="suggestion-chip" data-prompt="What questions can you answer from the documents?">
              <span class="chip-icon">❓</span>
              <span>What can you answer?</span>
            </button>
          </div>
        </div>

        
        <div class="messages-container" id="messages-container"></div>

      </main>

      
      <footer class="input-area">
        <form class="input-form" id="chat-form">
          <div class="input-wrapper">
            <textarea
              id="user-input"
              placeholder="Message Nova AI..."
              rows="1"
              autocomplete="off"
              aria-label="Chat input"
            ></textarea>
            <button type="submit" id="send-btn" aria-label="Send message" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M22 2L15 22 11 13 2 9l20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <p class="input-hint">Nova AI may make mistakes. Verify important information from source citations.</p>
        </form>
      </footer>

    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
